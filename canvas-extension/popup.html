<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11Planner – Canvas Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      width: 360px;
      min-height: 200px;
    }

    .header {
      background: linear-gradient(135deg, #306844, #255236);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: white;
    }

    .header span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .content {
      padding: 16px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .section input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .section input:focus {
      border-color: #306844;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #306844;
      color: white;
    }

    .btn-primary:hover {
      background: #255236;
    }

    .btn-primary:disabled {
      background: #1e3a2e;
      color: #4a7a5a;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #273548;
      color: #e2e8f0;
    }

    .status {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .status.success {
      background: #14532d;
      color: #86efac;
      display: block;
    }

    .status.error {
      background: #450a0a;
      color: #fca5a5;
      display: block;
    }

    .status.info {
      background: #1e3a5f;
      color: #93c5fd;
      display: block;
    }

    .preview {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: none;
    }

    .preview-item {
      padding: 8px 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
    }

    .preview-item:last-child {
      border-bottom: none;
    }

    .preview-item .title {
      font-weight: 600;
      color: #e2e8f0;
    }

    .preview-item .meta {
      color: #64748b;
      margin-top: 2px;
    }

    .count-badge {
      background: #306844;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
    }

    details {
      margin-bottom: 12px;
    }

    summary {
      cursor: pointer;
      font-size: 12px;
      color: #64748b;
      padding: 4px 0;
      list-style: none;
    }

    summary:hover {
      color: #94a3b8;
    }

    .settings-panel {
      padding: 12px 0 4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div>
      <h1>11Planner Canvas Sync</h1>
      <span>Extract assignments from this Canvas page</span>
    </div>
  </div>

  <div class="content">
    <div id="status" class="status"></div>

    <button class="btn btn-primary" id="extractBtn">
      🎓 Extract Assignments
    </button>

    <div class="preview" id="preview">
      <div id="previewList"></div>
    </div>

    <button class="btn btn-primary" id="syncBtn" style="display:none;">
      ⬆️ Sync to 11Planner <span id="syncCount" class="count-badge">0</span>
    </button>

    <details>
      <summary>⚙️ Settings</summary>
      <div class="settings-panel">
        <div class="section">
          <label>Backend URL</label>
          <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
        </div>
        <div class="section">
          <label>Your User ID (from Supabase)</label>
          <input id="userId" type="text" placeholder="Paste your Supabase user UUID" />
        </div>
        <button class="btn btn-secondary" id="saveSettings">Save Settings</button>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>

</html>
