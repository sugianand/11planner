<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11Planner – Canvas Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      width: 360px;
      min-height: 200px;
    }

    .header {
      background: linear-gradient(135deg, #306844, #255236);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: white;
    }

    .header span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .content {
      padding: 16px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .section input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .section input:focus {
      border-color: #306844;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #306844;
      color: white;
    }

    .btn-primary:hover {
      background: #255236;
    }

    .btn-primary:disabled {
      background: #1e3a2e;
      color: #4a7a5a;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #273548;
      color: #e2e8f0;
    }

    .status {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .status.success {
      background: #14532d;
      color: #86efac;
      display: block;
    }

    .status.error {
      background: #450a0a;
      color: #fca5a5;
      display: block;
    }

    .status.info {
      background: #1e3a5f;
      color: #93c5fd;
      display: block;
    }

    /* ── User badge (logged-in state) ── */
    .user-badge {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-badge .avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #306844, #255236);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .user-badge .info {
      flex: 1;
      min-width: 0;
    }

    .user-badge .user-email {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-badge .connected-label {
      font-size: 10px;
      color: #4ade80;
      margin-top: 2px;
    }

    .btn-danger {
      background: #1e293b;
      color: #f87171;
      border: 1px solid #7f1d1d;
      font-size: 12px;
    }

    .btn-danger:hover {
      background: #450a0a;
    }

    .preview {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: none;
    }

    .preview-item {
      padding: 8px 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
    }

    .preview-item:last-child {
      border-bottom: none;
    }

    .preview-item .title {
      font-weight: 600;
      color: #e2e8f0;
    }

    .preview-item .meta {
      color: #64748b;
      margin-top: 2px;
    }

    .count-badge {
      background: #306844;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
    }

    details {
      margin-bottom: 12px;
    }

    summary {
      cursor: pointer;
      font-size: 12px;
      color: #64748b;
      padding: 4px 0;
      list-style: none;
    }

    summary:hover {
      color: #94a3b8;
    }

    .settings-panel {
      padding: 12px 0 4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div>
      <h1>11Planner Canvas Sync</h1>
      <span>Extract assignments from this Canvas page</span>
    </div>
  </div>

  <div class="content">
    <div id="status" class="status"></div>

    <!-- ── NOT LOGGED IN ── -->
    <div id="loginPanel">
      <div class="section">
        <label>11Planner Email</label>
        <input id="loginEmail" type="email" placeholder="your@email.com" autocomplete="email" />
      </div>
      <div class="section">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Your 11Planner password" />
      </div>
      <button class="btn btn-primary" id="loginBtn">🔑 Log In to 11Planner</button>
    </div>

    <!-- ── LOGGED IN ── -->
    <div id="mainPanel" style="display:none;">
      <div class="user-badge">
        <div class="avatar" id="userAvatar">?</div>
        <div class="info">
          <div class="user-email" id="userEmail">—</div>
          <div class="connected-label">Connected to 11Planner ✓</div>
        </div>
      </div>

      <button class="btn btn-primary" id="extractBtn">🎓 Extract Assignments</button>

      <div class="preview" id="preview">
        <div id="previewList"></div>
      </div>

      <button class="btn btn-primary" id="syncBtn" style="display:none;">
        ⬆️ Sync to 11Planner <span id="syncCount" class="count-badge">0</span>
      </button>

      <button class="btn btn-danger" id="logoutBtn" style="margin-top:4px;">Sign Out</button>

      <details style="margin-top:8px;">
        <summary>⚙️ Advanced</summary>
        <div class="settings-panel">
          <div class="section">
            <label>Backend URL</label>
            <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
          </div>
          <button class="btn btn-secondary" id="saveSettings">Save</button>
        </div>
      </details>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
