<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11Planner – Canvas Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 440px;
      min-height: 620px;
      font-family: "Manrope", "Segoe UI", "Inter", sans-serif;
      background:
        radial-gradient(circle at 8% 2%, rgba(38, 140, 90, 0.45), transparent 42%),
        radial-gradient(circle at 95% 5%, rgba(46, 123, 182, 0.32), transparent 38%),
        linear-gradient(160deg, #08101a 0%, #0e1725 55%, #121c2f 100%);
      color: #eaf2ff;
    }

    body {
      border: 1px solid rgba(148, 163, 184, 0.22);
      overflow: hidden;
    }

    .header {
      position: relative;
      padding: 20px 22px 18px;
      background: linear-gradient(140deg, rgba(20, 104, 66, 0.92), rgba(19, 84, 62, 0.8));
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      right: -28px;
      top: -36px;
      width: 140px;
      height: 140px;
      border-radius: 999px;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.18), transparent 70%);
      pointer-events: none;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #ffffff;
    }

    .header span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: rgba(240, 255, 248, 0.86);
      font-weight: 500;
    }

    .content {
      padding: 18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .section {
      margin-bottom: 14px;
    }

    .section label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #98abc9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .section input {
      width: 100%;
      background: rgba(17, 26, 42, 0.72);
      border: 1px solid rgba(119, 141, 173, 0.44);
      border-radius: 12px;
      padding: 10px 12px;
      color: #f1f7ff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .section input::placeholder {
      color: #89a0c4;
    }

    .section input:focus {
      border-color: #58d9a3;
      box-shadow: 0 0 0 3px rgba(88, 217, 163, 0.22);
      background: rgba(20, 31, 48, 0.85);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      margin-bottom: 10px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2d7b57, #236949);
      color: white;
      box-shadow: 0 12px 30px -18px rgba(67, 206, 146, 0.75);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #359968, #2a7c56);
      box-shadow: 0 14px 32px -16px rgba(72, 212, 152, 0.9);
    }

    .btn-primary:disabled {
      background: #243648;
      color: #88a2c0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(24, 37, 58, 0.75);
      color: #d2deef;
      border: 1px solid rgba(132, 156, 191, 0.34);
    }

    .btn-secondary:hover {
      background: rgba(36, 51, 78, 0.82);
      color: #f2f7ff;
    }

    .status {
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      display: none;
      border: 1px solid transparent;
    }

    .status.success {
      background: rgba(20, 83, 45, 0.7);
      color: #9ef2c0;
      border-color: rgba(110, 231, 183, 0.34);
      display: block;
    }

    .status.error {
      background: rgba(96, 22, 33, 0.72);
      color: #ffc1cb;
      border-color: rgba(251, 113, 133, 0.4);
      display: block;
    }

    .status.info {
      background: rgba(22, 63, 112, 0.76);
      color: #b8dcff;
      border-color: rgba(125, 188, 255, 0.35);
      display: block;
    }

    .user-badge {
      background: rgba(24, 36, 56, 0.8);
      border: 1px solid rgba(124, 149, 184, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge .avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #2d7b57, #236949);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 10px 22px -14px rgba(88, 216, 158, 0.85);
    }

    .user-badge .info {
      flex: 1;
      min-width: 0;
    }

    .user-badge .user-email {
      font-size: 12px;
      color: #edf4ff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-badge .connected-label {
      font-size: 10px;
      color: #85f3bb;
      margin-top: 2px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn-danger {
      background: rgba(72, 21, 34, 0.45);
      color: #ffb3bf;
      border: 1px solid rgba(255, 133, 152, 0.34);
      font-size: 12px;
      margin-top: 2px;
    }

    .btn-danger:hover {
      background: rgba(102, 29, 47, 0.62);
    }

    .preview {
      background: rgba(18, 29, 46, 0.8);
      border: 1px solid rgba(120, 145, 179, 0.32);
      border-radius: 12px;
      max-height: 265px;
      overflow-y: auto;
      margin-bottom: 14px;
      display: none;
    }

    .preview-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(130, 156, 190, 0.2);
      font-size: 12px;
    }

    .preview-item:last-child {
      border-bottom: none;
    }

    .preview-item .title {
      font-weight: 700;
      color: #edf5ff;
    }

    .preview-item .meta {
      color: #9db2d2;
      margin-top: 3px;
    }

    .preview-courses {
      margin: 10px 0 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .course-chip {
      background: rgba(49, 132, 92, 0.24);
      color: #d6ffe8;
      border: 1px solid rgba(112, 242, 183, 0.28);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      letter-spacing: 0.02em;
    }

    .count-badge {
      background: #2b7a57;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-size: 12px;
      color: #9eb3d2;
      font-weight: 700;
      padding: 6px 0;
      list-style: none;
    }

    summary:hover {
      color: #e6f0ff;
    }

    .settings-panel {
      padding: 12px 0 4px;
    }

    .panel-card {
      background: rgba(17, 27, 44, 0.62);
      border: 1px solid rgba(132, 157, 192, 0.24);
      border-radius: 14px;
      padding: 14px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div>
      <h1>11Planner Canvas Sync</h1>
      <span>Extract courses and tasks from this Canvas page</span>
    </div>
  </div>

  <div class="content">
    <div id="status" class="status"></div>

    <div id="loginPanel" class="panel-card">
      <div class="section">
        <label>11Planner Email</label>
        <input id="loginEmail" type="email" placeholder="your@email.com" autocomplete="email" />
      </div>
      <div class="section">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Your 11Planner password" />
      </div>
      <button class="btn btn-primary" id="loginBtn">Log In to 11Planner</button>
    </div>

    <div id="mainPanel" style="display:none;">
      <div class="user-badge">
        <div class="avatar" id="userAvatar">?</div>
        <div class="info">
          <div class="user-email" id="userEmail">—</div>
          <div class="connected-label">Connected to 11Planner</div>
        </div>
      </div>

      <button class="btn btn-primary" id="extractBtn">Extract Courses and Tasks</button>

      <div class="preview" id="preview">
        <div class="preview-item" style="border-bottom:1px solid #334155;">
          <div class="title">Detected Courses <span id="courseCount" class="count-badge">0</span></div>
          <div class="preview-courses" id="courseList"></div>
        </div>
        <div id="previewList"></div>
      </div>

      <button class="btn btn-primary" id="syncBtn" style="display:none;">
        Sync to 11Planner <span id="syncCount" class="count-badge">0</span>
      </button>

      <button class="btn btn-danger" id="logoutBtn" style="margin-top:4px;">Sign Out</button>

      <details style="margin-top:8px;">
        <summary>Advanced</summary>
        <div class="settings-panel">
          <div class="section">
            <label>Backend URL</label>
            <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
          </div>
          <button class="btn btn-secondary" id="saveSettings">Save</button>
        </div>
      </details>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
